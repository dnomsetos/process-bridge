name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: Native (CMake + CTest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build

      - name: Configure
        run: |
          cmake --preset snapshotter-x86_64-debug

      - name: Build
        run: cmake --build --preset snapshotter-x86_64-debug

      - name: Run tests (CTest)
        run: ctest --preset snapshotter-x86_64-debug

