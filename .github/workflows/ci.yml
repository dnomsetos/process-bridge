name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  snapshotter-test:
    name: Snapshotter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build clang

      - name: Configure
        run: |
          cmake --preset snapshotter-x86_64-debug

      - name: Build
        run: cmake --build --preset snapshotter-x86_64-debug

      - name: Run tests (CTest)
        run: ctest --preset snapshotter-x86_64-debug
  
  loader-test:
    name: Loader
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build clang

      - name: Configure
        run: |
          cmake --preset loader-debug

      - name: Build
        run: cmake --build --preset loader-debug

      - name: Run tests (CTest)
        run: ctest --preset loader-debug
