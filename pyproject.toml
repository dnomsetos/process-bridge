[build-system]
requires = [
  "scikit-build-core>=0.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "process-bridge"
version = "0.1.0"
description = "Process snapshotting and emulation framework"
requires-python = ">=3.12"

dependencies = [
  "qiling",
]

[project.scripts]
process-bridge-x86_64-linux = "process_bridge.scripts:x86_64_linux"
process-bridge-i386-linux = "process_bridge.scripts:i386_linux"


[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "packaging"
build-dir = "build/{wheel_tag}"

wheel.packages = ["loader/process_bridge"]
